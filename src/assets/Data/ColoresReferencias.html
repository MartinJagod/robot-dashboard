<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Escala de Colores – Temperatura, Humedad & Combinado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 24px;
      line-height: 1.4;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }
    h2 {
      margin: 32px 0 8px;
      font-size: 1.4rem;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 640px;
      margin-bottom: 32px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      font-size: 0.9rem;
      text-align: left;
    }
    th {
      background: #eaeaea;
    }
    .swatch {
      width: 20px;
      height: 20px;
      border: 1px solid #333;
    }
    .editable {
      cursor: text;
    }
    .note {
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Escala de Colores</h1>
  <p class="note">Haz clic sobre los valores o códigos para editarlos. Si cambias un código HEX válido, el cuadro de color se actualizará al instante.</p>
  <div id="content"></div>

  <script>
    // Datos extraídos de la función de mapeo
    const datasets = {
      temperature: [
        { range: "\u2264&nbsp;83.5 °F", color: "#696969" },
        { range: "\u2264&nbsp;85 °F",   color: "#2121cf" },
        { range: "\u2264&nbsp;86.5 °F", color: "#0092ff" },
        { range: "\u2264&nbsp;88 °F",   color: "#00abb2" },
        { range: "\u2264&nbsp;89.5 °F", color: "#209000" },
        { range: "\u2264&nbsp;91 °F",   color: "#ffc300" },
        { range: "\u2264&nbsp;92.5 °F", color: "#fe3103" },
        { range: "\u2264&nbsp;94 °F",   color: "#9a0000" },
        { range: ">&nbsp;94 °F",        color: "#9a0000" }
      ],
      humidity: [
        { range: "\u2264&nbsp;16 %",   color: "#d5d5d5" },
        { range: "\u2264&nbsp;19.5 %", color: "#efefef" },
        { range: "\u2264&nbsp;23 %",   color: "#eff7fa" },
        { range: "\u2264&nbsp;26.5 %", color: "#bfdfea" },
        { range: "\u2264&nbsp;30 %",   color: "#83dbdd" },
        { range: "\u2264&nbsp;33.5 %", color: "#44e0d2" },
        { range: "\u2264&nbsp;37 %",   color: "#1c65aa" },
        { range: "\u2264&nbsp;40.5 %", color: "#0e0e86" },
        { range: "\u2264&nbsp;44 %",   color: "#696969" },
        { range: ">&nbsp;44 %",        color: "#696969" }
      ],
      combined: [
        { range: "<&nbsp;83.5 °F",  color: "#696969" },
        { range: "<&nbsp;85 °F",    color: "#2121cf" },
        { range: "<&nbsp;88.5 °F",  color: "#0092ff" },
        { range: "<&nbsp;89.5 °F",  color: "#00abb2" },
        { range: "<&nbsp;91 °F",    color: "#209000" },
        { range: "<&nbsp;92.5 °F",  color: "#ffc300" },
        { range: "<&nbsp;94 °F",    color: "#fe3103" },
        { range: "<&nbsp;98 °F",    color: "#9a0000" },
        { range: "\u2265&nbsp;98 °F", color: "#9a0000" }
      ]
    };

    // Generador de tablas
    const makeTable = (title, data) => {
      const section = document.createElement('section');

      const heading = document.createElement('h2');
      heading.textContent = title.charAt(0).toUpperCase() + title.slice(1);
      section.appendChild(heading);

      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th>Color</th><th>Valor</th><th>Código HEX</th></tr></thead>`;
      const tbody = document.createElement('tbody');

      data.forEach(item => {
        const tr = document.createElement('tr');

        // Columna del cuadro de color
        const tdSwatch = document.createElement('td');
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = item.color;
        tdSwatch.appendChild(swatch);

        // Columna de rango/valor
        const tdRange = document.createElement('td');
        tdRange.className = 'editable';
        tdRange.setAttribute('contenteditable', 'true');
        tdRange.innerHTML = item.range;

        // Columna del código HEX
        const tdCode = document.createElement('td');
        tdCode.className = 'editable';
        tdCode.setAttribute('contenteditable', 'true');
        tdCode.textContent = item.color;

        tr.append(tdSwatch, tdRange, tdCode);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      section.appendChild(table);
      return section;
    };

    // Renderizar todas las escalas
    const content = document.getElementById('content');
    Object.entries(datasets).forEach(([key, data]) => {
      content.appendChild(makeTable(key, data));
    });

    // Listener para actualizar color al cambiar el código HEX
    document.querySelectorAll('tbody').forEach(tbody => {
      tbody.addEventListener('input', e => {
        const tr = e.target.closest('tr');
        const codeCell = tr.cells[2];
        const swatch = tr.cells[0].firstChild;
        const hex = codeCell.textContent.trim();
        if (/^#([0-9a-fA-F]{3}){1,2}$/.test(hex)) {
          swatch.style.background = hex;
        }
      });
    });
  </script>
</body>
</html>
